name: Swift (Linux)

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'scripts/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Project.swift'
      - 'Workspace.swift'
      - 'ISOInspector.xcodeproj/**'
      - 'ISOInspector.xcworkspace/**'
      - '.github/workflows/*.yml'
jobs:
  lint-build-test:
    name: SwiftLint, Build, Test & Coverage (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Swift 6.4
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: '6.4'

      - name: SwiftLint autocorrect check
        run: |
          set -euo pipefail
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work" -w /work ghcr.io/realm/swiftlint:0.57.0 \
            /bin/sh -lc 'rm -f .swiftlint.cache; swiftlint --fix --no-cache --config .swiftlint.yml --baseline .swiftlint.baseline.json'
          if ! git diff --quiet; then
            echo "::error::SwiftLint --fix produced changes. Run scripts/swiftlint-format.sh locally and commit."
            git --no-pager diff --name-only
            exit 1
          fi

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build (debug with tests)
        run: |
          # Build only platform-independent targets (iOS/macOS-only targets skipped on Linux)
          swift build --target ISOInspectorKit
          swift build --target ISOInspectorCLI
          swift build --target ISOInspectorCLIRunner
          # Build platform-independent tests
          swift build --target ISOInspectorKitTests
          swift build --target ISOInspectorCLITests

      - name: Test with coverage
        run: |
          # Test platform-independent targets only
          swift build --product isoinspect --enable-code-coverage
          swift test --enable-code-coverage \
            --filter 'ISOInspectorKitTests|ISOInspectorCLITests'

      - name: Coverage summary
        run: |
          set -euo pipefail
          bin_path="$(swift build --show-bin-path)"
          profile="${bin_path}/codecov/default.profdata"
          if [ ! -f "$profile" ]; then
            echo "::error::Coverage profile not found at $profile"
            exit 1
          fi
          # The instrumented CLI contains the Kit and CLI coverage maps.
          binary="${bin_path}/isoinspect"
          if [ ! -x "$binary" ]; then
            echo "::error::Instrumented CLI not found: $binary"
            exit 1
          fi
          llvm-cov report --ignore-filename-regex='Tests/' --instr-profile="$profile" \
            "$binary"
